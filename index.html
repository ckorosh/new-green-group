<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه مواد غذایی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: #f2f5f4; }
    header, .mobile-menu, footer { background: #0d6b2f; color: white; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
    .logo { font-weight: bold; }
    nav { display: flex; gap: 15px; }
    nav a, .mobile-menu a, .footer-links a { color: white; text-decoration: none; padding: 6px 10px; }
    .hamburger { display: none; flex-direction: column; gap: 4px; cursor: pointer; }
    .hamburger span { width: 25px; height: 3px; background: white; }
    .mobile-menu { display: none; flex-direction: column; padding: 10px; }
    @media (max-width: 700px) { nav { display: none; } .hamburger { display: flex; } }
    footer { padding: 25px 20px; text-align: center; }
    .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
    main { padding: 20px; text-align: center; }
      /* استایل مدرن نوار جستجو */
    .search-box {
      flex: 1;
      display: flex;
      justify-content: center;
      margin: 0 15px;
    }
    .search-box input {
      width: 100%;
      max-width: 300px;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    /* مدرن‌سازی نوبار */
    header {
      background: linear-gradient(135deg, #0d6b2f, #159345);
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    /* مدرن‌سازی فوتر */
    footer {
      background: linear-gradient(135deg, #0d6b2f, #159345);
      box-shadow: 0 -3px 10px rgba(0,0,0,0.25);
    }

</style>
</head>
<body>

<header>
  <div class="logo">فروشگاه مواد غذایی</div>
  
  <!-- نوار جستجو -->
  <div class="search-box">
    <input type="text" placeholder="جستجوی محصول...">
  </div>

  <nav>
    <a href="#">خانه</a>
    <a href="#">محصولات</a>
    <a href="#">تخفیف‌ها</a>
    <a href="#">درباره ما</a>
  </nav>

  <div class="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="#">خانه</a>
  <a href="#">محصولات</a>
  <a href="#">تخفیف‌ها</a>
  <a href="#">درباره ما</a>
</div>

<main>
  <h2>به فروشگاه ما خوش آمدید</h2>
  <p>مواد غذایی تازه با تحویل سریع</p>
</main>

<footer>
  <div class="footer-links">
    <a href="#">تماس با ما</a>
    <a href="#">پشتیبانی</a>
    <a href="#">قوانین</a>
  </div>
  <p>تمامی حقوق محفوظ است © 2025</p>
</footer>

<script>
function toggleMenu() {
  const menu = document.getElementById("mobileMenu");
  menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>
